[package]
name = "FileViewers"
version = "0.8.0"
description = "File Viewers"
authors = ["fuongz <hi@phuongphung.com>"]
edition = "2021"

[lib]
name = "file_viewers_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.43", default-features = false, features = ["libsqlite3-sys", "bundled", "hooks"] }
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSEvent", "NSResponder", "NSTouch", "NSView", "NSWindow", "block2"] }
tauri-plugin-liquid-glass = "0.1.6"
objc2 = "0.6"

