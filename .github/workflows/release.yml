  verify-updater:
    needs: [release-macos]
    # needs: [release-macos, release-linux, release-linux-fedora, release-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output latest.json
          # Linux and Windows are paused. To restore them, add these platforms
          # to the list below: linux-x86_64-appimage, linux-x86_64-deb,
          # linux-x86_64-rpm, windows-x86_64.
          jq -e --arg tag "$RELEASE_TAG" '
            (.version | ltrimstr("v")) == ($tag | ltrimstr("v")) and
            (.platforms | [
              .["darwin-aarch64"],
              .["darwin-x86_64"]
            ] | all(
              (.url | type == "string" and startswith("https://")) and
              (.signature | type == "string" and length > 0)
            ))
          ' latest.json
