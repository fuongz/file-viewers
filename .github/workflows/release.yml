name: Release

on:
  release:
    types: [published]

jobs:
  release-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop-app/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop-app
        run: bun install --frozen-lockfile

      # Detect whether Apple signing secrets are configured.
      # We do this via an env var so the secret value is never interpolated
      # directly into the shell script (avoids log exposure).
      - name: Detect Apple signing secrets
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
          fi

      # Signed + notarized build (requires Developer ID Application cert).
      - name: Build and publish .dmg (signed)
        if: steps.signing.outputs.enabled == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop-app
          tagName: ${{ github.event.release.tag_name }}
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json --bundles app,dmg --target universal-apple-darwin

      # Unsigned build — Gatekeeper will warn on first launch but the app works.
      - name: Build and publish .dmg (unsigned)
        if: steps.signing.outputs.enabled == 'false'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop-app
          tagName: ${{ github.event.release.tag_name }}
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json --bundles app,dmg --target universal-apple-darwin

  release-linux:
    # tauri-action merges and replaces latest.json. Give each writer its turn.
    needs: [release-macos, release-linux-fedora]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libdbus-1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop-app/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop-app
        run: bun install --frozen-lockfile

      - name: Build and publish .deb + .AppImage
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBKIT_DISABLE_COMPOSITING_MODE: 1
          NO_AT_BRIDGE: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop-app
          tagName: ${{ github.event.release.tag_name }}
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json --bundles deb,appimage

  release-linux-fedora:
    needs: release-macos
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    container: fedora:latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Fedora system dependencies
        run: |
          dnf install -y \
            git \
            curl \
            file \
            openssl-devel \
            dbus-devel \
            gtk3-devel \
            webkit2gtk4.1-devel \
            libappindicator-gtk3-devel \
            librsvg2-devel \
            patchelf \
            gcc \
            make \
            unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop-app/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop-app
        run: bun install --frozen-lockfile

      - name: Build and publish .rpm
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBKIT_DISABLE_COMPOSITING_MODE: 1
          NO_AT_BRIDGE: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop-app
          tagName: ${{ github.event.release.tag_name }}
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json --bundles rpm

  release-windows:
    needs: release-linux
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop-app/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop-app
        run: bun install --frozen-lockfile

      - name: Build and publish .msi + .exe
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop-app
          tagName: ${{ github.event.release.tag_name }}
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json --bundles msi,nsis

  verify-updater:
    needs: [release-macos, release-linux, release-linux-fedora, release-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output latest.json
          jq -e --arg tag "$RELEASE_TAG" '
            (.version | ltrimstr("v")) == ($tag | ltrimstr("v")) and
            (.platforms | [
              .["darwin-aarch64"],
              .["darwin-x86_64"],
              .["linux-x86_64-appimage"],
              .["linux-x86_64-deb"],
              .["linux-x86_64-rpm"],
              .["windows-x86_64"]
            ] | all(
              (.url | type == "string" and startswith("https://")) and
              (.signature | type == "string" and length > 0)
            ))
          ' latest.json
